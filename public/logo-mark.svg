<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <!-- Abstract X mark — angled overlapping geometric strokes -->
  <g>
    <!-- Stroke 1: top-left to bottom-right -->
    <line x1="20" y1="20" x2="100" y2="100" stroke="#145bff" stroke-width="14" stroke-linecap="round"/>
    <!-- Stroke 2: top-right to bottom-left -->
    <line x1="100" y1="20" x2="20" y2="100" stroke="#071a3d" stroke-width="14" stroke-linecap="round"/>
    <!-- Accent dot at intersection -->
    <circle cx="60" cy="60" r="8" fill="#c8ff2c"/>
  </g>
</svg>
